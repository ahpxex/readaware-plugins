name: Validate registry

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The committed bundles are checked byte-for-byte; build with this Bun.
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # validate, typecheck, test, and committed main.js == fresh build
      - run: bun run check
